# =============================================================================
#  horn-workflow :: project definition file  (single source of truth)
# =============================================================================
#  Theory reference:
#    B. Kolbrek, "Horn Theory: An Introduction", Parts 1 & 2, audioXpress 2008
#    (docs/an-introduction-to-horn-theory.pdf)
#
#  Units used throughout (numbers only, no unit strings):
#    length mm | area cm^2 | volume cm^3 | mass g | compliance m/N
#    mechanical resistance Ns/m | inductance mH | resistance ohm | force T*m
#    frequency Hz | voltage Vrms | distance m | angle deg
#
#  Stage 1 (this file + `python run_workflow.py`) runs the native 1P/LE solver.
#  `environment:` and `ath:` are only used by Stage 2 (ATH -> Gmsh -> AKABAK).
# =============================================================================

meta:
  project: jbl_80-250Hz_midbass
  author: Alexandre
  notes: >
    Mid-bass horn. Stage 1 = 1P (Webster) horn model + lumped-element driver model.
    Stage 2 re-runs the same geometry in ATH (OS-SE) -> Gmsh -> AKABAK BEM.

# -----------------------------------------------------------------------------
# Acoustic target
# -----------------------------------------------------------------------------
target:
  f_low: 80            # lower limit of the intended passband [Hz]
  f_high: 250          # upper limit of the intended passband [Hz]
  fc: auto             # "auto" -> the flare is derived from horn.mouth_radius + horn.length
  krm_target: 0.9      # mouth criterion k*rm at fc (0.7-1 bass, >=1 mid/tweet)
                       #   only used when horn.mouth_radius is "auto"

# -----------------------------------------------------------------------------
# Horn geometry - these two numbers are the ones you can play with:
#   mouth_radius  = half the width of the horn opening   [mm]
#   length        = how deep the horn is                 [mm]
# With target.fc = auto the tool tells you which cut-off frequency that shape
# gives you, how flat the response is, and how big the box will be.
# -----------------------------------------------------------------------------
horn:
  profile: exponential
  throat_diameter: 300.0     # = 2r0; for cone drivers: 0.6-1.0 x the cone diameter
  length: 900                # <-- play with this: 600 ... 1200 mm
  mouth_radius: 600          # <-- play with this: 450 ... 750 mm (900 ... 1500 mm across)
  hyperbolic_T: 0.7          # only for profile: hyperbolic
  coverage_angle: 45         # half included angle [deg] (os / conical)
  throat_angle: 0            # half included angle at the throat [deg]
  tractrix_angle: 90         # wall tangent angle at the mouth for tractrix [deg]
# Reference numbers for this file (150 mm throat radius):
#   mouth 1200 mm + depth 900 mm  -> flare cut-off ~84 Hz, envelope 1.30 m3
#   a "mouth criterion" 80 Hz horn needs about a 1370 mm mouth and 2100 mm depth
#   (see results/report.md, section 3, for the whole table)

# -----------------------------------------------------------------------------
# Driver: lumped-element parameters (same model as the ABEC LE script)
#   *** PLACEHOLDER VALUES - REPLACE WITH THE REAL DRIVER DATA ***
#   Fill from the datasheet / a DATS or REW impedance measurement.  The values
#   below are a self-consistent 15" (380 mm) mid-bass cone so that the workflow
#   runs end to end; they are NOT measured data for any real JBL model.
# -----------------------------------------------------------------------------
driver:
  name: placeholder_15inch
  dD: 380.0         # effective piston diameter [mm], Sd = pi*dD^2/4
  Mms: 65.0         # moving mass incl. air load [g]
  Cms: 2.5e-4       # suspension compliance [m/N]  (fs ~ 39 Hz with Mms above)
  Rms: 4.0          # mechanical resistance [Ns/m]
  Bl: 17.0          # force factor [T*m]
  Re: 6.0           # voice-coil DC resistance [ohm]
  Le: 1.2           # voice-coil inductance [mH]
  ExpoRe: 1.0       # AKABAK model: Re(f) = Re*(1 + f/fre)^ExpoRe  (eddy currents)
  fre: 10.0         # reference frequency of the Re model [kHz], typically 2..20
  ExpoLe: 0.618     # AKABAK model: Xe = w*Le*(1+ExpoLe*q^2)/(1+q^2), q = w*Le/Re
                    #   (ExpoLe = 0.5..0.7 fits most drivers; = 1 -> pure Le)
  rear_volume: 100000.0  # rear chamber [cm^3] = 100 litres; 0 -> open back
  rear_q: 7.0       # rear cavity losses

# -----------------------------------------------------------------------------
# Simulation setup (Stage 1 native solver)
# -----------------------------------------------------------------------------
simulation:
  voltage: 2.83                      # drive voltage [Vrms]
  f_min: 20
  f_max: 1000
  n_frequencies: 400
  spacing: log                       # log | linear
  c: 343.0                           # speed of sound [m/s]
  rho: 1.205                         # air density [kg/m^3]
  mouth_termination: piston_infinite_baffle
                                     # infinite_pipe | piston_infinite_baffle | sphere
  segments: 200                      # segments used by the finite-horn two-port model
  observation_distance: 1.0          # SPL reference distance [m]
  directivity: piston                # piston = Q from the mouth ka (paper Eq. 25-26)

# -----------------------------------------------------------------------------
# Stage 2 only: ATH -> Gmsh -> AKABAK
# -----------------------------------------------------------------------------
environment:
  platform: windows                  # windows | wine
  ath_exe: "C:/ath/ath.exe"
  wine_prefix: null
  gmsh_cmd: "C:/gmsh/gmsh.exe %f -"
  gnuplot_path: "C:/Program Files/gnuplot/bin/gnuplot"
  akabak_exe: "C:/Program Files/AKABAK/AKABAK_Free_64r.exe"
  output_root: "C:/Horns"

ath:
  profile: os_se                     # os_se | circ_arc   (ATH native families)
  term_s: 0.7
  term_q: 0.995
  term_n: 4.0
  os_k: 1.0
  coverage_angle: 45                 # half included angle [deg]
  rollback: false
  rollback_start: 0.6
  rollback_angle: 180
  mesh:
    angular_segments: 64
    length_segments: 120
    throat_resolution: 4.0
    mouth_resolution: 20.0
    interface_resolution: 20.0
    interface_offset: 5.0
    subdomain_slices: auto           # auto -> single interface at the mouth
    quadrants: 1                     # 1 = quarter symmetry, 14 = half
  abec:
    sim_type: 2                      # 1 = infinite baffle, 2 = free standing
    sim_profile: 0                   # >= 0 -> force CircSym with this profile index
    f1: 80
    f2: 250
    num_frequencies: 40
    abscissa: 1                      # 1 = logarithmic
    mesh_frequency: 2000
  source:
    shape: 1                         # 1 = spherical cap, 2 = flat disc
    radius: -1                       # -1 -> auto-match the throat angle
    curv: 0                          # 1 convex, -1 concave, 0 automatic
    velocity: 1                      # 1 = normal to element, 2 = axial
  le:
    script: null                     # null -> auto-generated from the driver: block
    voltage: 2.83
  polars:
    - tag: SPL
      map_angle_range: [0, 90, 19]
      norm_angle: 10
      distance: 3.0
      offset: auto                   # auto -> horn length
  output:
    stl: true
    msh: false
    abec_project: true

# -----------------------------------------------------------------------------
# Output / reporting
# -----------------------------------------------------------------------------
output:
  dir: results
  csv: true
  plots: true
  report_md: true

# -----------------------------------------------------------------------------
# Comparison (sweep) mode - "try different mouth sizes and lengths"
#
#   python run_workflow.py params/horn_80_250Hz.yaml --sweep
#   python run_workflow.py params/horn_80_250Hz.yaml \
#          --sweep horn.mouth_radius=450,600,750 --sweep horn.length=600,900,1200
#
# Every value is combined with every other value (full grid).  Written to
# <output.dir>/sweep/: sweep.csv, sweep_report.md and comparison figures.
# -----------------------------------------------------------------------------
sweep:
  horn.mouth_radius: [450, 600, 750]
  horn.length: [600, 900, 1200]
  # other axes worth trying:
  #   horn.profile: [exponential, hyperbolic]
  #   horn.hyperbolic_T: [0.5, 0.7, 1.0]
  #   horn.throat_diameter: [250, 300, 380]
  #   simulation.mouth_termination: [piston_infinite_baffle, sphere]
  #   driver.rear_volume: [50000, 100000, 200000]
