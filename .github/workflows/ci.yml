name: checks

# main must always be green: 147/147 legacy checks + the pytest suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Legacy checks (no pytest needed)
        run: python3 tests/test_theory.py

      - name: Frozen JBL baseline
        run: python3 -m pytest tests/test_baseline.py -q

      - name: Full pytest suite
        run: python3 -m pytest tests/ -q

      - name: Run the pipeline on the shipped example
        run: python3 run_pipeline.py params/horn_jbl_1200b.yaml --out /tmp/ci-runs

      - name: The viewer shell must be self-contained
        run: |
          V=$(ls -d /tmp/ci-runs/run_* | tail -1)/deliverables/viewer
          test -f "$V/viewer.html" -a -f "$V/scene.glb"
          test -f "$V/app_view.json" -a -f "$V/ui/app.js" -a -f "$V/ui/app.css"
          test -f "$V/vendor/three.min.js"

      - name: The legacy CLI must still work
        run: python3 run_workflow.py params/horn_jbl_1200b.yaml --out /tmp/ci-legacy
